name: SABIGOZAR CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Build + end-to-end test (real panel, Xray, nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: |
          python3 -m py_compile scripts/*.py tools/*.py tests/*.py
          bash -n entrypoint.sh scripts/*.sh

      - name: Build Docker image
        run: docker build -t sabigozar:test .

      - name: End-to-end test
        run: python3 tests/e2e.py sabigozar:test

      - name: Container logs (on failure)
        if: failure()
        run: docker logs sabi-e2e 2>&1 | tail -n 300 || true
